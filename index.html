<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Rayo — furniture & home objects eCommerce website</title>
  </head>
  <body>
    <main>
      <div class="section-1">
        <div class="header-1">
          <div class="logo"><a>r</a></div>
          <div class="nav-bar-1">
            <nav>
              <ul>
                <li>Catalog</li>
                <li>Designer</li>
                <li>About</li>
                <li>Journal</li>
                <li>Contact</li>
              </ul>
            </nav>
          </div>
        </div>
        <div class="hero-section-1">
          <div class="hero-title">
            <h1>Rayo</h1>
          </div>
          <div class="hero-text">
            <span
              >Choose from a collection of stylish retro accents or create your
              own unique model with different colors and shapes</span
            >
          </div>
          <div class="catalog-button"><button>Catalog</button></div>
        </div>
      </div>
      <div class="section-2">
        <div class="section-2-content">
          <div class="nav-bar-2">
            <div class="icons-section">
              <div class="search-icon icons">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="#cf4538"
                  viewBox="0 0 24 24"
                >
                  <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                  <path
                    d="M10.5 19c1.98 0 3.81-.69 5.25-1.83L20 21.42l1.41-1.41-4.25-4.25a8.47 8.47 0 0 0 1.83-5.25c0-4.69-3.81-8.5-8.5-8.5S2 5.81 2 10.5 5.81 19 10.5 19m0-15c3.58 0 6.5 2.92 6.5 6.5S14.08 17 10.5 17 4 14.08 4 10.5 6.92 4 10.5 4"
                  ></path>
                </svg>
              </div>
              <div class="favorites-icon icons">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="#cf4538"
                  viewBox="0 0 24 24"
                >
                  <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                  <path
                    d="M11.29 20.69c.2.2.45.29.71.29s.51-.1.71-.29l7.5-7.5c2.35-2.35 2.35-6.05 0-8.41-2.29-2.29-5.84-2.35-8.21-.2-2.36-2.15-5.91-2.09-8.21.2-2.35 2.36-2.35 6.06 0 8.41z"
                  ></path>
                </svg>
              </div>
              <div class="cart-icon icons">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="#cf4538"
                  viewBox="0 0 24 24"
                >
                  <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                  <path
                    d="M21 6H7.05L5.94 2.68A1 1 0 0 0 4.99 2h-3v2h2.28l3.54 10.63A2 2 0 0 0 9.71 16h7.59a2 2 0 0 0 1.87-1.3l2.76-7.35c.11-.31.07-.65-.11-.92A1 1 0 0 0 21 6m-3.69 8H9.72l-2-6h11.84zM10 18a2 2 0 1 0 0 4 2 2 0 1 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 1 0 0-4"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
          <div class="hero-image"><img src="assets/hero-image-1.png" /></div>
        </div>
      </div>
    </main>
  </body>
</html>
